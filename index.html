<script>window.tailwind&&(tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#123B70',accent:'#35A9E8',night:'#0B1730',mist:'#F5F8FC'}},fontFamily:{sans:['Manrope','Inter','system-ui','sans-serif']}}}})</script>
<style>



/* base */ @media all {
  html {
    scroll-behavior: smooth;
    scroll-padding-top: 5rem;
  }
  body {
    background:#fff;font-family:Manrope,Inter,system-ui,sans-serif;color:#0B1730;-webkit-font-smoothing:antialiased;
  }
  /* Focus visibile: blu sulle zone chiare, azzurro sulle zone scure */
  :focus-visible {
    outline: 3px solid #123b70;
    outline-offset: 3px;
    border-radius: 4px;
  }
  .dark-zone :focus-visible {
    outline-color: #35a9e8;
  }
}

/* Comparsa discreta delle sezioni */
.reveal {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.is-visible {
  opacity: 1;
  transform: none;
}

/* Animazioni SVG */
@keyframes flow {
  to {
    stroke-dashoffset: -28;
  }
}
.flow {
  stroke-dasharray: 5 9;
  animation: flow 2.2s linear infinite;
}
@keyframes arm-swing {
  0%,
  100% {
    transform: rotate(-7deg);
  }
  50% {
    transform: rotate(9deg);
  }
}
.arm-swing {
  animation: arm-swing 6s ease-in-out infinite;
}
@keyframes sheet-out {
  0%,
  100% {
    transform: translateX(0);
  }
  50% {
    transform: translateX(10px);
  }
}
.sheet-out {
  animation: sheet-out 5s ease-in-out infinite;
}
@keyframes caret {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}
.caret {
  animation: caret 1.2s steps(1) infinite;
}

/* Rispetto della preferenza di riduzione delle animazioni */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }
  .flow,
  .arm-swing,
  .sheet-out,
  .caret {
    animation: none !important;
  }
}
</style>
